<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%" style="background:#ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Graph (1) -->
  <g transform="translate(30, 20)">
    <text x="10" y="20" font-size="14" font-weight="bold" fill="#0f172a">(1)</text>
    <line x1="20" y1="80" x2="180" y2="80" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="50" y1="150" x2="50" y2="15" stroke="#0f172a" stroke-width="1.5"/>
    <text x="185" y="84" font-size="12" fill="#0f172a">x</text>
    <text x="50" y="10" font-size="12" fill="#0f172a" text-anchor="middle">y</text>
    <line x1="25" y1="140" x2="160" y2="40" stroke="#0284c7" stroke-width="2.5"/>
    <text x="110" y="95" font-size="12" font-weight="bold" fill="#0f172a">3</text>
    <text x="40" y="135" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="end">-4</text>
  </g>

  <!-- Graph (2) -->
  <g transform="translate(290, 20)">
    <text x="10" y="20" font-size="14" font-weight="bold" fill="#0f172a">(2)</text>
    <line x1="20" y1="130" x2="180" y2="130" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="40" y1="150" x2="40" y2="15" stroke="#0f172a" stroke-width="1.5"/>
    <text x="185" y="134" font-size="12" fill="#0f172a">x</text>
    <text x="40" y="10" font-size="12" fill="#0f172a" text-anchor="middle">y</text>
    <line x1="25" y1="35" x2="155" y2="145" stroke="#0284c7" stroke-width="2.5"/>
    <text x="135" y="145" font-size="12" font-weight="bold" fill="#0f172a">3</text>
    <text x="32" y="45" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="end">4</text>
  </g>

  <!-- Graph (3) -->
  <g transform="translate(30, 200)">
    <text x="10" y="20" font-size="14" font-weight="bold" fill="#0f172a">(3)</text>
    <line x1="20" y1="130" x2="180" y2="130" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="40" y1="150" x2="40" y2="15" stroke="#0f172a" stroke-width="1.5"/>
    <text x="185" y="134" font-size="12" fill="#0f172a">x</text>
    <text x="40" y="10" font-size="12" fill="#0f172a" text-anchor="middle">y</text>
    <line x1="25" y1="50" x2="165" y2="145" stroke="#0284c7" stroke-width="2.5"/>
    <text x="145" y="145" font-size="12" font-weight="bold" fill="#0f172a">4</text>
    <text x="32" y="60" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="end">3</text>
  </g>

  <!-- Graph (4) -->
  <g transform="translate(290, 200)">
    <text x="10" y="20" font-size="14" font-weight="bold" fill="#0f172a">(4)</text>
    <line x1="20" y1="80" x2="180" y2="80" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="50" y1="150" x2="50" y2="15" stroke="#0f172a" stroke-width="1.5"/>
    <text x="185" y="84" font-size="12" fill="#0f172a">x</text>
    <text x="50" y="10" font-size="12" fill="#0f172a" text-anchor="middle">y</text>
    <line x1="25" y1="130" x2="160" y2="40" stroke="#0284c7" stroke-width="2.5"/>
    <text x="120" y="95" font-size="12" font-weight="bold" fill="#0f172a">4</text>
    <text x="40" y="130" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="end">-3</text>
  </g>
