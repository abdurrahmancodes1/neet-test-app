<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="100%" style="background:#ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Ground -->
  <line x1="30" y1="210" x2="390" y2="210" stroke="#0f172a" stroke-width="2"/>

  <!-- Projectile path from O -->
  <path d="M 60,210 Q 190,40 320,210" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Point O -->
  <circle cx="60" cy="210" r="4" fill="#0f172a"/>
  <text x="50" y="230" font-size="15" font-weight="bold" fill="#0f172a">O</text>

  <!-- Velocity vector v1 at 30 deg -->
  <line x1="60" y1="210" x2="125" y2="155" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="125,155 112,158 119,168" fill="#dc2626"/>
  <text x="105" y="145" font-size="14" font-weight="bold" fill="#dc2626">v₁</text>

  <!-- Angle arc 30 deg -->
  <path d="M 95,210 A 35,35 0 0,0 90,185" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <text x="96" y="200" font-size="12" font-weight="bold" fill="#0f172a">30°</text>

  <!-- Point P at highest point vertical projection -->
  <!-- Peak of parabolic curve is at x=190, y=125 -->
  <circle cx="190" cy="210" r="4" fill="#0f172a"/>
  <text x="190" y="230" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">P</text>

  <!-- Vertical projectile from P -->
  <line x1="190" y1="210" x2="190" y2="135" stroke="#059669" stroke-width="2.5"/>
  <polygon points="190,135 185,148 195,148" fill="#059669"/>
  <text x="205" y="165" font-size="14" font-weight="bold" fill="#059669">v₂</text>

  <!-- Peak point -->
  <circle cx="190" cy="125" r="4" fill="#dc2626"/>
</svg>
