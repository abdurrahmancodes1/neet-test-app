<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%" style="background:#ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Graph (1) -->
  <g transform="translate(30, 20)">
    <text x="10" y="20" font-size="14" font-weight="bold" fill="#0f172a">(1)</text>
    <!-- Axes -->
    <line x1="40" y1="130" x2="190" y2="130" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="40" y1="130" x2="40" y2="25" stroke="#0f172a" stroke-width="1.5"/>
    <text x="195" y="134" font-size="12" fill="#0f172a">x(m)</text>
    <text x="40" y="15" font-size="12" fill="#0f172a" text-anchor="middle">v(m s⁻¹)</text>
    <!-- Curve: Straight line -->
    <line x1="40" y1="45" x2="150" y2="130" stroke="#0284c7" stroke-width="2.5"/>
    <text x="35" y="48" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="end">√20</text>
    <text x="150" y="145" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">5</text>
  </g>

  <!-- Graph (2) -->
  <g transform="translate(290, 20)">
    <text x="10" y="20" font-size="14" font-weight="bold" fill="#0f172a">(2)</text>
    <!-- Axes -->
    <line x1="40" y1="130" x2="190" y2="130" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="40" y1="130" x2="40" y2="25" stroke="#0f172a" stroke-width="1.5"/>
    <text x="195" y="134" font-size="12" fill="#0f172a">x(m)</text>
    <text x="40" y="15" font-size="12" fill="#0f172a" text-anchor="middle">v(m s⁻¹)</text>
    <!-- Curve: Concave curve from (0, √20) to (5, 0) -->
    <path d="M 40,45 Q 120,45 150,130" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <text x="35" y="48" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="end">√20</text>
    <text x="150" y="145" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">5</text>
  </g>

  <!-- Graph (3) -->
  <g transform="translate(30, 200)">
    <text x="10" y="20" font-size="14" font-weight="bold" fill="#0f172a">(3)</text>
    <!-- Axes -->
    <line x1="40" y1="130" x2="190" y2="130" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="40" y1="130" x2="40" y2="25" stroke="#0f172a" stroke-width="1.5"/>
    <text x="195" y="134" font-size="12" fill="#0f172a">x(m)</text>
    <text x="40" y="15" font-size="12" fill="#0f172a" text-anchor="middle">v(m s⁻¹)</text>
    <!-- Curve: Asymptote -->
    <path d="M 40,45 Q 50,115 150,122" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <text x="35" y="48" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="end">√20</text>
    <text x="150" y="145" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">5</text>
  </g>

  <!-- Graph (4) -->
  <g transform="translate(290, 200)">
    <text x="10" y="20" font-size="14" font-weight="bold" fill="#0f172a">(4)</text>
    <!-- Axes -->
    <line x1="40" y1="130" x2="190" y2="130" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="40" y1="130" x2="40" y2="25" stroke="#0f172a" stroke-width="1.5"/>
    <text x="195" y="134" font-size="12" fill="#0f172a">x(m)</text>
    <text x="40" y="15" font-size="12" fill="#0f172a" text-anchor="middle">v(m s⁻¹)</text>
    <!-- Curve: Step function -->
    <line x1="40" y1="45" x2="110" y2="45" stroke="#0284c7" stroke-width="2.5"/>
    <line x1="110" y1="45" x2="110" y2="130" stroke="#0284c7" stroke-width="2.5"/>
    <text x="35" y="48" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="end">√20</text>
    <text x="110" y="145" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">5</text>
  </g>
</svg>
