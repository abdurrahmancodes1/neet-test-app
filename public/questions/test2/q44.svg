<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%" style="background:#ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Axes -->
  <line x1="40" y1="170" x2="360" y2="170" stroke="#0f172a" stroke-width="2"/>
  <line x1="80" y1="260" x2="80" y2="30" stroke="#0f172a" stroke-width="2"/>
  <text x="365" y="174" font-size="14" fill="#0f172a">t (s)</text>
  <text x="80" y="20" font-size="14" fill="#0f172a" text-anchor="middle">a (m/s²)</text>

  <!-- a-t curve -->
  <!-- t=0 (x=80) to t=2 (x=140): horizontal line at a=10 (y=70) -->
  <line x1="80" y1="70" x2="140" y2="70" stroke="#0284c7" stroke-width="3"/>
  <!-- t=2 (x=140) to t=6 (x=240, y=170) to t=8 (x=290, y=220) -->
  <line x1="140" y1="70" x2="290" y2="220" stroke="#0284c7" stroke-width="3"/>

  <!-- Vertical dashed line at t=2 -->
  <line x1="140" y1="70" x2="140" y2="170" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Horizontal dashed line at a=10 -->
  <line x1="80" y1="70" x2="140" y2="70" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Labels -->
  <text x="70" y="75" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="end">10</text>
  <text x="140" y="190" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">2</text>
  <text x="240" y="190" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">6</text>
</svg>
