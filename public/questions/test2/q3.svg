<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" style="background:#ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <circle cx="160" cy="160" r="110" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Diameter AB -->
  <line x1="160" y1="50" x2="160" y2="270" stroke="#0f172a" stroke-width="2"/>
  <!-- Chord AC at 30 deg -->
  <line x1="160" y1="50" x2="65" y2="215" stroke="#0284c7" stroke-width="2.5"/>
  <!-- Labels -->
  <text x="160" y="40" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">A</text>
  <text x="160" y="295" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">B</text>
  <text x="50" y="225" font-size="16" font-weight="bold" fill="#0284c7" text-anchor="middle">C</text>
  <!-- Angle 30 deg arc -->
  <path d="M 160,105 A 55,55 0 0,1 135,97" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="138" y="115" font-size="13" font-weight="bold" fill="#dc2626">30°</text>
  <!-- Radius R -->
  <text x="175" y="165" font-size="13" font-style="italic" fill="#64748b">R</text>
</svg>
