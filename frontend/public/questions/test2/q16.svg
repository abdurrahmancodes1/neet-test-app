<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="100%" height="100%" style="background:#ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Ground -->
  <line x1="20" y1="240" x2="420" y2="240" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Tower -->
  <rect x="140" y="60" width="24" height="180" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Height label -->
  <line x1="120" y1="60" x2="120" y2="240" stroke="#64748b" stroke-width="1.5"/>
  <line x1="110" y1="60" x2="130" y2="60" stroke="#64748b" stroke-width="1.5"/>
  <line x1="110" y1="240" x2="130" y2="240" stroke="#64748b" stroke-width="1.5"/>
  <text x="105" y="155" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">H = 5500/3 m</text>

  <!-- Horizontal reference line at top -->
  <line x1="164" y1="60" x2="250" y2="60" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Velocity vector at 53 deg below horizontal -->
  <line x1="164" y1="60" x2="230" y2="148" stroke="#dc2626" stroke-width="2.5"/>
  <!-- Arrowhead -->
  <polygon points="230,148 220,135 235,138" fill="#dc2626"/>
  <text x="240" y="145" font-size="14" font-weight="bold" fill="#dc2626">u = 500/3 m s⁻¹</text>

  <!-- Angle arc -->
  <path d="M 204,60 A 40,40 0 0,1 188,92" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <text x="208" y="80" font-size="13" font-weight="bold" fill="#0f172a">53°</text>

  <!-- Trajectory path -->
  <path d="M 164,60 Q 230,150 360,240" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="360" cy="240" r="4" fill="#2563eb"/>
</svg>
